name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*' # Trigger on version tags, e.g. v1.0.0, v1.0.1
  workflow_dispatch: # Allow manual one-click trigger from GitHub Actions tab
    inputs:
      version_tag:
        description: 'Release Tag (e.g. v1.0.0). Leave empty to use run number.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK (21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Android Workload
        run: dotnet workload install maui-android

      - name: Prepare Signing Keystore
        id: prepare-keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using custom keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "alias=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_OUTPUT
            echo "keypass=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "storepass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_OUTPUT
          else
            echo "Generating self-signed release keystore..."
            keytool -genkey -v -keystore release.keystore \
              -alias koorah \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass koorah123 -keypass koorah123 \
              -dname "CN=KooRah, OU=Navigation, O=KooRah, L=Tehran, C=IR"
            echo "alias=koorah" >> $GITHUB_OUTPUT
            echo "keypass=koorah123" >> $GITHUB_OUTPUT
            echo "storepass=koorah123" >> $GITHUB_OUTPUT
          fi

      - name: Determine Version
        id: versioning
        run: |
          BUILD_NUM=${{ github.run_number }}
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            VERSION_NAME="${TAG_NAME#v}"
          elif [ -n "${{ github.event.inputs.version_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.version_tag }}"
            VERSION_NAME="${TAG_NAME#v}"
          else
            TAG_NAME="v1.0.${BUILD_NUM}"
            VERSION_NAME="1.0.${BUILD_NUM}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_num=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "Version: $VERSION_NAME (Build $BUILD_NUM, Tag $TAG_NAME)"

      - name: Build & Publish Signed Android APK
        run: |
          dotnet publish KooRah.App/KooRah.App.csproj \
            -f net10.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk \
            -p:ApplicationVersion=${{ steps.versioning.outputs.build_num }} \
            -p:ApplicationDisplayVersion=${{ steps.versioning.outputs.version_name }} \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=../release.keystore \
            -p:AndroidSigningKeyAlias="${{ steps.prepare-keystore.outputs.alias }}" \
            -p:AndroidSigningKeyPass="${{ steps.prepare-keystore.outputs.keypass }}" \
            -p:AndroidSigningStorePass="${{ steps.prepare-keystore.outputs.storepass }}"

      - name: Locate & Name Final APK
        id: locate-apk
        run: |
          RAW_APK=$(find KooRah.App/bin/Release/net10.0-android/ -name "*-Signed.apk" -o -name "*.apk" | head -n 1)
          echo "Found APK at: $RAW_APK"
          OUTPUT_APK="KooRah-${{ steps.versioning.outputs.tag_name }}.apk"
          cp "$RAW_APK" "$OUTPUT_APK"
          echo "Created final APK: $OUTPUT_APK"
          echo "apk_path=$OUTPUT_APK" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate-apk.outputs.apk_path }}
          path: ${{ steps.locate-apk.outputs.apk_path }}
          retention-days: 60

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: "KooRah ${{ steps.versioning.outputs.tag_name }} (Android)"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🧭 KooRah Navigation - Android Release ${{ steps.versioning.outputs.tag_name }}
            
            - **100% On-Device & Offline Routing** (Tehran OSM Graph ~200,000 intersections).
            - **3 Racing Algorithms** (Dijkstra, A*, Bidirectional A*).
            - **Free Dynamic Tehran Traffic Model** (Empirical rush-hour speeds).
            - **Interactive 3D Map** with tap-to-pick destination and driving follow mode.
            
            #### 📥 Download & Install
            Download the APK file below and install it directly on your Android phone.
          files: |
            ${{ steps.locate-apk.outputs.apk_path }}
