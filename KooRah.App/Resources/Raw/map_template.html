<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #F8FAFC;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Vazirmatn", "IRANSans", sans-serif;
            user-select: none;
        }

        #map-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #F8FAFC;
            direction: ltr;
        }

        #map {
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        /* Atmospheric horizon fade in 3D driving view - Light daytime sky gradient */
        .horizon-fog {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 140px;
            background: linear-gradient(to bottom, #E2E8F0 0%, rgba(226, 232, 240, 0.5) 50%, transparent 100%);
            pointer-events: none;
            z-index: 850;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        #map-viewport.nav-mode .horizon-fog,
        #map-viewport.mode-3d .horizon-fog { opacity: 1; }

        /* Top Driving Maneuver Banner - Persian RTL */
        .maneuver-banner {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 950;
            background: linear-gradient(135deg, #0F766E, #0D9488);
            border-bottom: 1px solid #115E59;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 10px 30px rgba(13, 148, 136, 0.25);
            padding: 14px 18px;
            display: none;
            flex-direction: row;
            align-items: center;
            gap: 16px;
            direction: rtl;
            text-align: right;
            animation: slideDown 0.35s ease-out forwards;
        }
        .maneuver-banner.active { display: flex; }
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .maneuver-icon-box {
            width: 48px; height: 48px; border-radius: 14px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.35);
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; color: #FFFFFF; font-weight: bold; flex-shrink: 0;
        }
        .maneuver-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
            text-align: right;
        }
        .maneuver-distance {
            font-size: 13px;
            font-weight: 700;
            color: #CCFBF1;
            letter-spacing: 0.3px;
        }
        .maneuver-street {
            font-size: 16px;
            font-weight: 700;
            color: #FFFFFF;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Floating Re-center Button - transitions between 30px (idle/minimized) and 245px (card open) */
        .btn-recenter {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 950;
            background-color: #FFFFFF;
            color: #0D9488;
            border: 1.5px solid #0D9488;
            border-radius: 28px;
            padding: 10px 22px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(13, 148, 136, 0.18);
            display: none;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            white-space: nowrap;
            direction: rtl;
            transition: transform 0.2s ease, background-color 0.2s ease, bottom 0.3s ease;
        }
        .btn-recenter:hover {
            background-color: #F0FDFA;
            transform: translateX(-50%) scale(1.04);
        }
        .btn-recenter.visible {
            display: flex;
            animation: popIn 0.25s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }
        @keyframes popIn {
            from { transform: translateX(-50%) scale(0.8); opacity: 0; }
            to { transform: translateX(-50%) scale(1); opacity: 1; }
        }

        /* Floating map controls - transitions between 30px (idle/minimized) and 245px (card open) */
        .floating-controls-right {
            position: absolute;
            bottom: 30px;
            right: 16px;
            z-index: 900;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            transition: bottom 0.3s ease;
        }
        .btn-ctrl {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background-color: #FFFFFF;
            color: #1E293B;
            border: 1px solid #E2E8F0;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-ctrl:hover {
            background-color: #F8FAFC;
            color: #0D9488;
        }
        .btn-ctrl.active {
            background-color: #0D9488;
            color: #FFFFFF;
            border-color: #0D9488;
            box-shadow: 0 4px 16px rgba(13, 148, 136, 0.25);
        }
        .zoom-group {
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #E2E8F0;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
            background-color: #FFFFFF;
        }
        .zoom-group .btn-ctrl {
            border-radius: 0;
            border: none;
            box-shadow: none;
            font-size: 18px;
        }
        .zoom-top { border-bottom: 1px solid #E2E8F0 !important; }

        /* Custom Pins with pop-in drop animation */
        .map-pin {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #FFFFFF;
            box-shadow: 0 3px 12px rgba(15, 23, 42, 0.3);
            cursor: pointer;
        }
        .pin-start-inner, .pin-dest-inner {
            animation: pinPopIn 0.3s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }
        @keyframes pinPopIn {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pin-start { border: 3.5px solid #0D9488; }
        .pin-start-inner { width: 9px; height: 9px; border-radius: 50%; background-color: #0D9488; }
        .pin-dest { border: 3.5px solid #EF4444; }
        .pin-dest-inner { width: 9px; height: 9px; border-radius: 50%; background-color: #EF4444; }

        /* Vehicle avatar container */
        .car-marker-container {
            width: 52px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            filter: drop-shadow(0 6px 14px rgba(15, 23, 42, 0.35));
        }
        .car-3d-svg {
            width: 48px;
            height: 66px;
        }

        .vehicle-toast {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 990;
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            color: #0F172A;
            padding: 7px 18px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.1);
            display: none;
            pointer-events: none;
            direction: rtl;
        }

        .maplibregl-popup-content {
            background-color: #FFFFFF !important;
            color: #0F172A !important;
            border: 1px solid #E2E8F0 !important;
            border-radius: 12px !important;
            font-family: inherit !important;
            direction: rtl !important;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.12) !important;
        }
        .maplibregl-popup-tip {
            border-top-color: #FFFFFF !important;
            border-bottom-color: #FFFFFF !important;
        }
        .maplibregl-ctrl-attrib { display: none; }
    </style>
</head>
<body>
    <div id="map-viewport">
        <div id="map"></div>
        <div class="horizon-fog"></div>

        <!-- Maneuver Banner (Driving Mode) -->
        <div id="maneuverBanner" class="maneuver-banner">
            <div id="maneuverIcon" class="maneuver-icon-box">⬆</div>
            <div class="maneuver-details">
                <div id="maneuverDistance" class="maneuver-distance">شروع مسیر</div>
                <div id="maneuverStreet" class="maneuver-street">مسیر مشخص شده را دنبال کنید</div>
            </div>
        </div>

        <!-- Re-center Button -->
        <button id="btnRecenter" class="btn-recenter" onclick="recenterMap()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
            </svg>
            موقعیت من
        </button>

        <!-- Floating Map Controls -->
        <div class="floating-controls-right">
            <div id="btn3D" class="btn-ctrl" onclick="toggle3D()" title="تغییر زاویه دید سه‌بعدی">2D</div>
            <div class="zoom-group">
                <button class="btn-ctrl zoom-top" onclick="map.zoomIn()" title="بزرگ‌نمایی">+</button>
                <button class="btn-ctrl zoom-bottom" onclick="map.zoomOut()" title="کوچک‌نمایی">−</button>
            </div>
            <div id="btnLayers" class="btn-ctrl" onclick="toggleLayer()" title="تغییر ظاهر نقشه">🗺️</div>
        </div>

        <div id="vehicleToast" class="vehicle-toast">خودرو: سواری سفید</div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script>
        // -------------------------------------------------------------
        // Persian RTL Text Plugin: Enables correct connected Arabic/Persian
        // text shaping and bidirectional layout on MapLibre vector tiles.
        // -------------------------------------------------------------
        try {
            if (typeof maplibregl.getRTLTextPluginStatus === 'function') {
                if (maplibregl.getRTLTextPluginStatus() === 'unavailable') {
                    maplibregl.setRTLTextPlugin(
                        'https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.js',
                        null,
                        true // Lazy load
                    );
                }
            }
        } catch(e) {
            console.warn('MapLibre RTL Plugin init warning:', e);
        }

        // C# injects coordinates as [[lat, lon], ...] / [lat, lon]
        // MapLibre expects [lon, lat] (GeoJSON standard)
        var rawRouteCoords = __ROUTE_COORDS__;
        var rawStartCoord = __START_COORD__;
        var rawEndCoord = __END_COORD__;

        function toLngLat(latLon) {
            if (!latLon || latLon.length < 2) return null;
            return [latLon[1], latLon[0]];
        }

        var routeCoords = (rawRouteCoords || []).map(toLngLat).filter(Boolean);
        var startCoord = toLngLat(rawStartCoord) || [51.3375, 35.6997];
        var endCoord = rawEndCoord ? toLngLat(rawEndCoord) : null;

        // -------------------------------------------------------------
        // Map Styles: OpenFreeMap Vector Tiles (OpenStreetMap data, free, fast)
        // Default style is set to STYLE_BRIGHT (Liberty Light Theme)
        // -------------------------------------------------------------
        var STYLE_DARK = 'https://tiles.openfreemap.org/styles/dark';
        var STYLE_BRIGHT = 'https://tiles.openfreemap.org/styles/liberty';
        var currentStyleIsDark = false; // Light style by default!

        // Boosted initial zoom levels for closer, clearer map view
        var initialZoom = (routeCoords.length > 0) ? 14.5 : 17.0;
        var map = new maplibregl.Map({
            container: 'map',
            style: STYLE_BRIGHT,
            center: startCoord,
            zoom: initialZoom,
            pitch: 0,
            bearing: 0,
            attributionControl: false,
            antialias: true
        });

        map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-left');

        // -------------------------------------------------------------
        // True 3D Buildings: Fill-extrusion layer drawn from OpenFreeMap vector tiles.
        // Inserted below symbol labels so street names remain readable on top of buildings.
        // -------------------------------------------------------------
        function addBuildingLayer() {
            try {
                var style = map.getStyle();
                if (!style || !style.sources) return;

                var sources = style.sources;
                var vectorSourceId = Object.keys(sources).find(function(id) {
                    return sources[id].type === 'vector';
                });

                if (!vectorSourceId || map.getLayer('koorah-3d-buildings')) return;

                // Find first symbol layer with text to place 3D buildings below street labels
                var layers = style.layers || [];
                var labelLayerId = null;
                for (var i = 0; i < layers.length; i++) {
                    if (layers[i].type === 'symbol' && layers[i].layout && layers[i].layout['text-field']) {
                        labelLayerId = layers[i].id;
                        break;
                    }
                }

                map.addLayer({
                    id: 'koorah-3d-buildings',
                    type: 'fill-extrusion',
                    source: vectorSourceId,
                    'source-layer': 'building',
                    minzoom: 14,
                    paint: {
                        'fill-extrusion-color': currentStyleIsDark ? '#19222C' : '#D0D7DE',
                        'fill-extrusion-height': ['coalesce', ['get', 'render_height'], ['get', 'height'], 7],
                        'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], ['get', 'min_height'], 0],
                        'fill-extrusion-opacity': 0.82
                    }
                }, labelLayerId);
            } catch(e) {
                console.warn('3D Buildings layer error:', e);
            }
        }

        // -------------------------------------------------------------
        // Route Layers (Glow outline + Core Vibrant Teal line)
        // -------------------------------------------------------------
        function addRouteLayers() {
            try {
                if (!routeCoords || routeCoords.length < 2) return;

                if (map.getSource('route')) {
                    map.getSource('route').setData({
                        type: 'Feature',
                        geometry: { type: 'LineString', coordinates: routeCoords }
                    });
                    return;
                }

                map.addSource('route', {
                    type: 'geojson',
                    data: {
                        type: 'Feature',
                        geometry: { type: 'LineString', coordinates: routeCoords }
                    }
                });

                map.addLayer({
                    id: 'route-glow',
                    type: 'line',
                    source: 'route',
                    layout: { 'line-join': 'round', 'line-cap': 'round' },
                    paint: { 'line-color': '#0D9488', 'line-width': 14, 'line-opacity': 0.25 }
                });

                map.addLayer({
                    id: 'route-core',
                    type: 'line',
                    source: 'route',
                    layout: { 'line-join': 'round', 'line-cap': 'round' },
                    paint: { 'line-color': '#0D9488', 'line-width': 6, 'line-opacity': 0.96 }
                });
            } catch(e) {
                console.warn('Route layer error:', e);
            }
        }

        function rebuildCustomLayers() {
            addBuildingLayer();
            if (routeCoords.length >= 2) addRouteLayers();
        }

        map.on('load', function() {
            rebuildCustomLayers();
            fitRouteBounds();
        });

        // -------------------------------------------------------------
        // Map Markers (Start Pin, Destination Pin)
        // -------------------------------------------------------------
        function elFromHtml(html) {
            var div = document.createElement('div');
            div.innerHTML = html.trim();
            return div.firstChild;
        }

        var startMarker = new maplibregl.Marker({
            element: elFromHtml('<div class="map-pin pin-start"><div class="pin-start-inner"></div></div>'),
            anchor: 'center'
        }).setLngLat(startCoord).addTo(map);
        startMarker.setPopup(new maplibregl.Popup({ offset: 18 }).setText('__START_TITLE__'));

        var destMarker = null;
        if (endCoord) {
            destMarker = new maplibregl.Marker({
                element: elFromHtml('<div class="map-pin pin-dest"><div class="pin-dest-inner"></div></div>'),
                anchor: 'center'
            }).setLngLat(endCoord).addTo(map);
            destMarker.setPopup(new maplibregl.Popup({ offset: 18 }).setText('__END_TITLE__'));
        }

        var isBottomCardOpen = false;
        window.setBottomCardVisible = function(visible) {
            isBottomCardOpen = !!visible;
            var controls = document.querySelector('.floating-controls-right');
            var recenter = document.getElementById('btnRecenter');
            var bottomPos = isBottomCardOpen ? '245px' : '30px';
            if (controls) controls.style.bottom = bottomPos;
            if (recenter) recenter.style.bottom = bottomPos;
        };

        function fitRouteBounds() {
            try {
                map.resize();
                var btmPad = isBottomCardOpen ? 230 : 50;
                if (routeCoords && routeCoords.length >= 2) {
                    var bounds = new maplibregl.LngLatBounds();
                    for (var i = 0; i < routeCoords.length; i++) {
                        bounds.extend(routeCoords[i]);
                    }
                    map.fitBounds(bounds, {
                        padding: { top: 120, bottom: btmPad, left: 30, right: 30 },
                        maxZoom: 18.2,
                        duration: 400
                    });
                } else if (endCoord) {
                    var bounds = new maplibregl.LngLatBounds();
                    bounds.extend(startCoord);
                    bounds.extend(endCoord);
                    map.fitBounds(bounds, {
                        padding: { top: 120, bottom: btmPad, left: 30, right: 30 },
                        maxZoom: 17.5,
                        duration: 400
                    });
                } else {
                    map.jumpTo({ center: startCoord, zoom: 17.0 });
                }
            } catch(e) {
                console.warn('fitRouteBounds error:', e);
            }
        }

        window.addEventListener('resize', function() {
            if (!isNavigating) map.resize();
        });

        // -------------------------------------------------------------
        // Interactive Map Click: Pick location manually on the map (Google Maps style)
        // -------------------------------------------------------------
        map.on('click', function(e) {
            // Ignore click if actively navigating in 3D driving mode
            if (isNavigating) return;

            var lng = e.lngLat.lng;
            var lat = e.lngLat.lat;

            // Move destination marker or create if not exists
            if (destMarker) {
                destMarker.setLngLat([lng, lat]);
            } else {
                destMarker = new maplibregl.Marker({
                    element: elFromHtml('<div class="map-pin pin-dest"><div class="pin-dest-inner"></div></div>'),
                    anchor: 'center'
                }).setLngLat([lng, lat]).addTo(map);
            }

            // Dispatch event to MAUI C#
            try {
                window.location.href = 'koorah://map/click?lat=' + lat.toFixed(6) + '&lon=' + lng.toFixed(6);
            } catch(err) {}
        });

        window.setDestinationTitle = function(title) {
            if (destMarker) {
                var popup = destMarker.getPopup();
                if (!popup) {
                    popup = new maplibregl.Popup({ offset: 18 });
                    destMarker.setPopup(popup);
                }
                popup.setText(title || 'مقصد انتخابی');
            }
        };

        window.clearDestinationMarker = function() {
            if (destMarker) {
                destMarker.remove();
                destMarker = null;
            }
        };

        // -------------------------------------------------------------
        // Layer switch: Light Mode / Dark Mode
        // -------------------------------------------------------------
        function toggleLayer() {
            currentStyleIsDark = !currentStyleIsDark;
            map.setStyle(currentStyleIsDark ? STYLE_DARK : STYLE_BRIGHT);
            map.once('style.load', rebuildCustomLayers);
            showToast(currentStyleIsDark ? 'نقشه: حالت شب' : 'نقشه: حالت روز');
        }

        // -------------------------------------------------------------
        // 3D Perspective Toggle
        // -------------------------------------------------------------
        var is3D = false;
        var OVERVIEW_PITCH = 58;
        var DRIVING_PITCH = 64;
        var DRIVING_ZOOM = 18.6;

        function toggle3D(forceState) {
            is3D = (typeof forceState === 'boolean') ? forceState : !is3D;
            var vp = document.getElementById('map-viewport');
            var btn = document.getElementById('btn3D');

            if (!isNavigating) {
                map.easeTo({ pitch: is3D ? OVERVIEW_PITCH : 0, duration: 500 });
                vp.classList.toggle('mode-3d', is3D);
                if (btn) {
                    btn.classList.toggle('active', is3D);
                    btn.innerText = is3D ? '3D' : '2D';
                }
            }
        }

        var currentCarPos = startCoord;
        var currentBearing = 0;

        function getBearing(c1, c2) {
            var lat1 = c1[1] * Math.PI / 180, lat2 = c2[1] * Math.PI / 180;
            var dLon = (c2[0] - c1[0]) * Math.PI / 180;
            var y = Math.sin(dLon) * Math.cos(lat2);
            var x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        // -------------------------------------------------------------
        // Driving Navigation State Machine
        // -------------------------------------------------------------
        function startDriving() {
            isNavigating = true;
            isUserFollowing = true;
            is3D = true;

            var vp = document.getElementById('map-viewport');
            vp.classList.add('nav-mode');
            vp.classList.remove('mode-3d');

            var banner = document.getElementById('maneuverBanner');
            if (banner) banner.classList.add('active');

            var btn = document.getElementById('btn3D');
            if (btn) { btn.classList.add('active'); btn.innerText = '3D'; }

            var initialPos = (routeCoords && routeCoords.length > 0) ? routeCoords[0] : startCoord;
            currentCarPos = initialPos;
            currentBearing = (routeCoords && routeCoords.length > 1) ? getBearing(routeCoords[0], routeCoords[1]) : 0;

            if (carMarker) {
                carMarker.setLngLat(initialPos);
                carMarker.setRotation(currentBearing);
            } else {
                carMarker = new maplibregl.Marker({
                    element: elFromHtml(vehicleHtml(currentVehicleKey)),
                    anchor: 'center',
                    rotationAlignment: 'map',
                    pitchAlignment: 'map'
                }).setLngLat(initialPos).addTo(map);
                carMarker.setRotation(currentBearing);
            }

            map.easeTo({
                center: initialPos,
                zoom: DRIVING_ZOOM,
                pitch: DRIVING_PITCH,
                bearing: currentBearing,
                duration: 600
            });

            setFollowing(true);
        }

        function stopDriving() {
            isNavigating = false;
            isUserFollowing = true;
            is3D = false;

            var vp = document.getElementById('map-viewport');
            vp.classList.remove('nav-mode');
            vp.classList.remove('mode-3d');

            var banner = document.getElementById('maneuverBanner');
            if (banner) banner.classList.remove('active');

            var recenterBtn = document.getElementById('btnRecenter');
            if (recenterBtn) recenterBtn.classList.remove('visible');

            var btn = document.getElementById('btn3D');
            if (btn) { btn.classList.remove('active'); btn.innerText = '2D'; }

            if (carMarker) {
                carMarker.remove();
                carMarker = null;
            }

            map.easeTo({ pitch: 0, bearing: 0, duration: 500 });
            if (routeCoords && routeCoords.length >= 2) {
                setTimeout(fitRouteBounds, 520);
            }
        }

        function recenterMap() {
            if (!currentCarPos) return;
            setFollowing(true);
            map.easeTo({
                center: currentCarPos,
                bearing: currentBearing,
                pitch: isNavigating ? DRIVING_PITCH : map.getPitch(),
                duration: 500
            });
        }

        function setFollowing(following) {
            isUserFollowing = following;
            var btn = document.getElementById('btnRecenter');
            if (btn) btn.classList.toggle('visible', !following);
            try {
                window.location.href = following ? 'koorah://nav/following=1' : 'koorah://nav/following=0';
            } catch (e) {}
        }

        map.on('dragstart', function() { if (isNavigating) setFollowing(false); });
        map.on('rotatestart', function() { if (isNavigating) setFollowing(false); });

        // -------------------------------------------------------------
        // Live GPS Update Bridge from C#
        // -------------------------------------------------------------
        window.updateUserNavigation = function(lat, lon, heading, speed, maneuverType, streetName, distanceMeters, arrivalFormatted) {
            currentCarPos = [lon, lat];
            if (typeof heading === 'number' && !isNaN(heading)) {
                currentBearing = heading;
            }

            if (carMarker) {
                carMarker.setLngLat(currentCarPos);
                carMarker.setRotation(currentBearing);
            } else if (isNavigating) {
                carMarker = new maplibregl.Marker({
                    element: elFromHtml(vehicleHtml(currentVehicleKey)),
                    anchor: 'center',
                    rotationAlignment: 'map',
                    pitchAlignment: 'map'
                }).setLngLat(currentCarPos).addTo(map);
                carMarker.setRotation(currentBearing);
            }

            if (isNavigating && isUserFollowing) {
                map.easeTo({
                    center: currentCarPos,
                    bearing: currentBearing,
                    duration: 400,
                    easing: function(t) { return t; }
                });
            }

            if (isNavigating) {
                var banner = document.getElementById('maneuverBanner');
                if (banner) banner.classList.add('active');

                var iconEl = document.getElementById('maneuverIcon');
                if (iconEl) {
                    var icons = {
                        'straight': '⬆',
                        'right': '↱',
                        'left': '↰',
                        'slight-right': '↗',
                        'slight-left': '↖',
                        'uturn': '↶'
                    };
                    iconEl.innerText = icons[maneuverType] || '⬆';
                }

                var streetEl = document.getElementById('maneuverStreet');
                if (streetEl && streetName) streetEl.innerText = streetName;

                var distEl = document.getElementById('maneuverDistance');
                if (distEl && typeof distanceMeters === 'number') {
                    distEl.innerText = distanceMeters >= 1000
                        ? 'در فاصله ' + (distanceMeters / 1000).toFixed(1) + ' کیلومتر'
                        : 'در فاصله ' + Math.round(distanceMeters) + ' متر';
                }
            }
        };

        // -------------------------------------------------------------

        var vehicleKeys = ['sedan', 'sport', 'suv'];
        var currentVehicleKey = localStorage.getItem('koorah_vehicle') || 'sedan';

        function vehicleHtml(key) {
            var v = VEHICLES[key] || VEHICLES['sedan'];
            return '<div class="car-marker-container" onclick="cycleVehicle()">' + v.svg + '</div>';
        }

        function cycleVehicle() {
            var idx = (vehicleKeys.indexOf(currentVehicleKey) + 1) % vehicleKeys.length;
            currentVehicleKey = vehicleKeys[idx];
            localStorage.setItem('koorah_vehicle', currentVehicleKey);

            if (carMarker) {
                carMarker.remove();
                carMarker = new maplibregl.Marker({
                    element: elFromHtml(vehicleHtml(currentVehicleKey)),
                    anchor: 'center',
                    rotationAlignment: 'map',
                    pitchAlignment: 'map'
                }).setLngLat(currentCarPos).addTo(map);
                carMarker.setRotation(currentBearing);
            }
            showToast('خودرو: ' + VEHICLES[currentVehicleKey].name);
        }
        window.cycleVehicleFromApp = cycleVehicle;

        function showToast(msg) {
            var t = document.getElementById('vehicleToast');
            if (!t) return;
            t.innerText = msg;
            t.style.display = 'block';
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(function() { t.style.display = 'none'; }, 2200);
        }

        var isNavigating = false;
        var isUserFollowing = true;
        var carMarker = null;
    </script>
