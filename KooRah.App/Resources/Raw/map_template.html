<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var routeCoords = __ROUTE_COORDS__;   // [[lat, lon], [lat, lon], ...]
        var startCoord = __START_COORD__;     // [lat, lon]
        var endCoord = __END_COORD__;         // [lat, lon]

        var map = L.map('map').setView(startCoord, 14);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        if (routeCoords.length > 0) {
            var polyline = L.polyline(routeCoords, { color: '#2b6cb0', weight: 5 }).addTo(map);
            map.fitBounds(polyline.getBounds(), { padding: [30, 30] });
        }

        L.marker(startCoord).addTo(map).bindPopup('Start');
        L.marker(endCoord).addTo(map).bindPopup('Destination');
    </script>
</body>
</html>
